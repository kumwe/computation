name: Computation CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: package

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate native dependency evidence and select its exact source
        id: native-source
        run: php tools/verify-native-release.php --github-outputs

      - name: Check out the independently selected native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kumwe/kumwe-engine
          ref: ${{ steps.native-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          path: native

      - name: Verify the published native source bundle and GitHub OIDC provenance
        if: steps.native-source.outputs.stable == 'true'
        working-directory: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_COMMIT: ${{ steps.native-source.outputs.commit }}
          NATIVE_TAG: ${{ steps.native-source.outputs.tag }}
          NATIVE_ARCHIVE_SHA256: ${{ steps.native-source.outputs.archive_sha256 }}
          NATIVE_PROVENANCE_SHA256: ${{ steps.native-source.outputs.provenance_sha256 }}
          ENGINE_COMMIT: ${{ steps.native-source.outputs.engine_commit }}
          ENGINE_TAG: ${{ steps.native-source.outputs.engine_tag }}
          ENGINE_ARCHIVE_SHA256: ${{ steps.native-source.outputs.engine_archive_sha256 }}
          ENGINE_PROVENANCE_SHA256: ${{ steps.native-source.outputs.engine_provenance_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$NATIVE_COMMIT"
          test "$(git rev-parse "refs/tags/$NATIVE_TAG^{commit}")" = "$NATIVE_COMMIT"
          for owner in engine kumwe-engine; do
            if [ "$owner" = engine ]; then
              commit="$ENGINE_COMMIT"; tag="$ENGINE_TAG"; digest="$ENGINE_ARCHIVE_SHA256"
              provenance_digest="$ENGINE_PROVENANCE_SHA256"; archive=kumwe-engine-source.tar.gz
            else
              commit="$NATIVE_COMMIT"; tag="$NATIVE_TAG"; digest="$NATIVE_ARCHIVE_SHA256"
              provenance_digest="$NATIVE_PROVENANCE_SHA256"; archive=kumwe-engine-php-source.tar.gz
            fi
            test "$(gh api "repos/kumwe/$owner/commits/$tag" --jq .sha)" = "$commit"
            gh api "repos/kumwe/$owner/releases/tags/$tag" \
              --jq 'select(.draft == false and .prerelease == false and .published_at != null) | .id' \
              > "$RUNNER_TEMP/$owner-published-release-id"
            test -s "$RUNNER_TEMP/$owner-published-release-id"
            bundle="$RUNNER_TEMP/verified-$owner-source"
            provenance="$RUNNER_TEMP/$owner-provenance"
            mkdir "$bundle" "$provenance"
            for name in "$archive" source.spdx.json source.json SHA256SUMS; do
              gh release download "$tag" --repo "kumwe/$owner" --dir "$bundle" --pattern "$name"
            done
            gh release download "$tag" --repo "kumwe/$owner" --dir "$provenance" \
              --pattern build-provenance.sigstore.json
            printf '%s  %s\n' "$digest" "$bundle/$archive" \
              "$provenance_digest" "$provenance/build-provenance.sigstore.json" | sha256sum --check --strict
            (cd "$bundle" && sha256sum --check --strict SHA256SUMS)
            branch="$(gh api "repos/kumwe/$owner" --jq '.default_branch')"
            for name in "$archive" source.spdx.json source.json SHA256SUMS; do
              gh attestation verify "$bundle/$name" --repo "kumwe/$owner" \
                --bundle "$provenance/build-provenance.sigstore.json" --source-digest "$commit" \
                --source-ref "refs/heads/$branch" \
                --cert-identity "https://github.com/kumwe/$owner/.github/workflows/ci.yml@refs/heads/$branch" \
                --deny-self-hosted-runners
            done
          done
          php tools/release-source.php verify "$RUNNER_TEMP/verified-kumwe-engine-source" \
            --expected-commit "$NATIVE_COMMIT" --expected-sha256 "$NATIVE_ARCHIVE_SHA256"

      - name: Build and load the pinned native extension
        working-directory: native
        env:
          NATIVE_COMMIT: ${{ steps.native-source.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$NATIVE_COMMIT"
          php tools/generate-arginfo.php --check
          php tools/verify-binding.php
          php tools/verify-engine.php
          phpize
          ./configure --enable-kumwe_engine
          make -j2
          php tools/expected-tuple.php > candidate-compatibility.json
          native_ini="$RUNNER_TEMP/kumwe-native.ini"
          cp "$(php -r 'echo php_ini_loaded_file();')" "$native_ini"
          printf '\nextension=%s/modules/kumwe_engine.so\n' "$PWD" >> "$native_ini"
          echo "PHPRC=$native_ini" >> "$GITHUB_ENV"
          echo "KUMWE_NATIVE_EXPECTED_TUPLE=$PWD/candidate-compatibility.json" >> "$GITHUB_ENV"

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('package/composer.json') }}
          restore-keys: composer-files-

      - name: Install the validated package toolchain
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer audit --abandoned=fail

      - name: Run the complete package gate
        run: composer check

      - name: Verify the no-dev installed-package autoloader and the shipped example
        run: |
          composer install --no-interaction --prefer-dist --no-dev --classmap-authoritative
          composer autoload:smoke
          composer examples
          composer test:native

  release-tests:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release transitions and repository setup
        run: |
          bash tools/test-release-record.sh
          bash tools/test-release-integrity.sh
          bash tools/test-release-on-record.sh
          bash tools/test-configure-release-repositories.sh

  package-gate:
    name: Package gate
    if: always()
    needs: [check, release-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all package and release tests
        env:
          PACKAGE_RESULT: ${{ needs.check.result }}
          RELEASE_RESULT: ${{ needs.release-tests.result }}
        run: test "$PACKAGE_RESULT" = success && test "$RELEASE_RESULT" = success
